name: spacephysics

channels:
  - conda-forge

dependencies:
  - python=3.12
  - jupyterlab
  - ipykernel
  - numpy
  - scipy
  - pandas
  - xlrd
  - xarray
  - matplotlib
  - ipympl
  - cartopy=0.24
  - viresclient
  # apexpy contains C and Fortran extensions. Use an explicit GCC/Gfortran pair;
  # on Windows, c-compiler only activates an external MSVC installation.
  - gcc
  - gfortran
  - pip
  - pip:
      - apexpy==2.1.1
      - pyswipe==0.9.8.1
      - git+https://github.com/klaundal/dipole.git
      - git+https://github.com/klaundal/polplot.git
      - ppigrf
      - pymsis
